name: Foundation CI
on:
  pull_request:
  push:
    branches: [feat/m001-foundation-catalog]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependencies
        run: npm ci
      # One-time M-001 bootstrap: format source on this feature branch only.
      # Delete this commit step and restrict permissions once formatting is persisted.
      - name: Persist formatted source on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m001-foundation-catalog'
        run: |
          npm run format
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(m001): format scaffold and tests'
            git push origin HEAD:feat/m001-foundation-catalog
          fi
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Design token contrast
        run: npm run test:tokens
      - name: Build
        run: npm run build
      - name: Chromium E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
