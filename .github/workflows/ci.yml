name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, feat/m002-hosted-readonly-gate]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: One-time staging scripts formatter
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m002-hosted-readonly-gate'
        run: |
          npx prettier --write scripts/staging-preflight.mjs scripts/staging-preflight.test.mjs
          git add scripts/staging-preflight.mjs scripts/staging-preflight.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(m002): format staging preflight scripts'
            git push origin HEAD:feat/m002-hosted-readonly-gate
          fi
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Staging preflight contract (offline; no cloud calls)
        run: npm run test:staging-preflight
      - name: Design token contrast
        run: npm run test:tokens
      - name: Build
        run: npm run build
      - name: Chromium E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload fixture visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m001-ui-review-screenshots
          path: test-results/**/ui-components.png
          if-no-files-found: ignore
          retention-days: 7
