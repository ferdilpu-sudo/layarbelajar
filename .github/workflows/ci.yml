name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, feat/m001-foundation-catalog]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile once on feature branch
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
      - name: Persist npm lockfile to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m001-foundation-catalog'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(m001): commit resolved npm lockfile'
            git push origin HEAD:feat/m001-foundation-catalog
          fi
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Design token contrast
        run: npm run test:tokens
      - name: Build
        run: npm run build
      - name: Chromium E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
