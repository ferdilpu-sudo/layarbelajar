name: M-002 Cloudflare Pages Read-Only Routes
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/pages-route-smoke.mjs'
      - 'scripts/pages-route-smoke.test.mjs'
      - '.github/workflows/pages-route-smoke.yml'
permissions:
  contents: read
jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression test (offline)
        run: node --test scripts/pages-route-smoke.test.mjs
      - name: Published Pages GET-only probe
        run: node scripts/pages-route-smoke.mjs
