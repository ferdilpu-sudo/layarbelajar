name: Temporary M-002 Formatter Preview
on:
  pull_request:
    paths:
      - 'scripts/hosted-auth-acceptance.mjs'
      - '.github/workflows/m002-format-preview.yml'
permissions:
  contents: read
jobs:
  format-preview:
    if: github.head_ref == 'feat/m002-hosted-synthetic-acceptance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Emit formatted source (base64, public code only; no secrets)
        run: |
          npx prettier --write scripts/hosted-auth-acceptance.mjs
          echo M002_FORMATTED_BEGIN
          base64 -w0 scripts/hosted-auth-acceptance.mjs
          echo
          echo M002_FORMATTED_END
